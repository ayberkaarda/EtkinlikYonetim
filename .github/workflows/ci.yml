name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      # The SQL Server tests run in the sql-server job below.
      ETKINLIK_SKIP_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  sql-server:
    # Real SQL Server locks, the owner's setup key script, the restricted application login and the
    # schema upgrades. A throw-away container that exists only for this job.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci.Only.Container1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci.Only.Container1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      ETKINLIK_TEST_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=Ci.Only.Container1;TrustServerCertificate=True;Connect Timeout=30;"
      # An unreachable server fails the job instead of skipping the tests.
      ETKINLIK_REQUIRE_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/EtkinlikYonetim.Data.Tests -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sql-server]
    runs-on: windows-latest
    env:
      # Passed through the environment and checked before use, never expanded into the script.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check tag name
        shell: pwsh
        run: |
          if ($env:REF_NAME -cnotmatch '^v[A-Za-z0-9._-]+$') { throw "Unsafe tag name for a file name." }
          "ARTIFACT=EtkinlikYonetim-$($env:REF_NAME)-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish
        run: dotnet publish src/EtkinlikYonetim.UI -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, README.tr.md, CHANGELOG.md, CHANGELOG.tr.md publish/
          Compress-Archive -Path publish/* -DestinationPath "$($env:ARTIFACT).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.zip
          if-no-files-found: error
